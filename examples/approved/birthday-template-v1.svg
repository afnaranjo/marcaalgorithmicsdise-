<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <style>
      .montserrat { font-family: Montserrat, Arial, sans-serif; }
      .purple { fill: #602B7A; }
      .yellow { fill: #FFD749; }
      .mint { fill: #33DFC0; }
      .raspberry { fill: #F44C75; }
      .white { fill: #FFFFFF; }
    </style>
    <clipPath id="studentClip">
      <path d="M0 285H425C485 350 520 475 526 650V1350H0Z"/>
    </clipPath>
  </defs>

  <!-- CANONICAL CANVAS -->
  <rect width="1080" height="1350" fill="#FFD749"/>

  <!-- Pixel environment: left midground -->
  <path fill="#602B7A" d="M0 276H66V318H100V352H132V386H162V421H190V456H218V492H246V530H274V568H0Z"/>
  <g fill="#33DFC0">
    <rect x="28" y="418" width="9" height="9"/><rect x="39" y="407" width="9" height="9"/><rect x="39" y="429" width="9" height="9"/><rect x="50" y="396" width="9" height="9"/><rect x="50" y="440" width="9" height="9"/>
    <rect x="72" y="396" width="9" height="9"/><rect x="72" y="440" width="9" height="9"/><rect x="83" y="407" width="9" height="9"/><rect x="83" y="429" width="9" height="9"/><rect x="94" y="418" width="9" height="9"/>
  </g>

  <!-- Pixel heart -->
  <g transform="translate(56 232) scale(3.2)">
    <rect x="0" y="4" width="4" height="4" fill="#602B7A"/><rect x="4" y="0" width="8" height="4" fill="#602B7A"/><rect x="16" y="0" width="8" height="4" fill="#602B7A"/><rect x="24" y="4" width="4" height="4" fill="#602B7A"/>
    <rect x="0" y="8" width="28" height="8" fill="#F44C75"/><rect x="4" y="16" width="20" height="4" fill="#F44C75"/><rect x="8" y="20" width="12" height="4" fill="#F44C75"/><rect x="12" y="24" width="4" height="4" fill="#F44C75"/>
  </g>

  <!-- Official logo slot. Use the repo asset in final export, never rebuild with text. -->
  <rect x="54" y="55" width="292" height="116" rx="8" fill="#FFD749" opacity="0"/>
  <image id="algorithmics-logo" href="../../assets/brand/logos/primary/algorithmics-logo-purple.png" x="54" y="55" width="292" height="72" preserveAspectRatio="xMinYMin meet"/>
  <text x="98" y="151" class="montserrat purple" font-size="19" font-weight="600">The international school</text>
  <text x="98" y="177" class="montserrat purple" font-size="19" font-weight="600">of programming</text>

  <!-- Top-right code icon -->
  <g transform="translate(900 64)" fill="none" stroke="#602B7A" stroke-width="6">
    <rect x="0" y="0" width="126" height="112"/>
    <line x1="0" y1="31" x2="126" y2="31"/>
    <circle cx="21" cy="16" r="4" fill="#602B7A" stroke="none"/><circle cx="42" cy="16" r="4" fill="#602B7A" stroke="none"/>
    <path d="M46 57L27 73L46 89M80 57L99 73L80 89M70 49L57 96"/>
  </g>

  <!-- Pixel confetti -->
  <g>
    <rect x="566" y="112" width="14" height="14" transform="rotate(-18 573 119)" fill="#33DFC0"/>
    <rect x="652" y="153" width="17" height="17" transform="rotate(42 660 161)" fill="#F44C75"/>
    <rect x="485" y="195" width="11" height="11" transform="rotate(-12 490 200)" fill="#F44C75"/>
    <rect x="496" y="205" width="11" height="11" transform="rotate(-12 501 210)" fill="#F44C75"/>
    <rect x="390" y="257" width="12" height="12" transform="rotate(-18 396 263)" fill="#33DFC0"/>
    <rect x="402" y="269" width="12" height="12" transform="rotate(-18 408 275)" fill="#33DFC0"/>
    <rect x="893" y="221" width="13" height="13" transform="rotate(-14 899 227)" fill="#33DFC0"/>
  </g>

  <!-- Pixel party hat -->
  <g transform="translate(704 147)">
    <rect x="78" y="0" width="18" height="18" fill="#602B7A"/><rect x="60" y="18" width="54" height="18" fill="#602B7A"/>
    <path d="M84 18L33 157H140Z" fill="#602B7A"/>
    <path d="M73 50H103L112 68H66ZM57 91H121L129 109H50ZM41 132H136L140 150H34Z" fill="#FFD749"/>
  </g>

  <!-- Headline lockup -->
  <text x="476" y="472" class="montserrat purple" font-size="205" font-weight="900" letter-spacing="-10">FELIZ</text>
  <text x="475" y="620" class="montserrat purple" font-size="105" font-weight="900" letter-spacing="-5">CUMPLEAÑOS</text>

  <!-- Name band: VARIABLE ONLY -->
  <rect x="478" y="666" width="561" height="101" rx="26" fill="#FFFFFF"/>
  <circle cx="540" cy="716" r="51" fill="#FFFFFF"/>
  <!-- simple pixel cake icon -->
  <g transform="translate(510 681)">
    <rect x="24" y="0" width="10" height="14" fill="#F44C75"/>
    <rect x="27" y="-8" width="4" height="8" fill="#FFD749"/>
    <rect x="5" y="24" width="48" height="13" fill="#F44C75"/>
    <rect x="0" y="37" width="58" height="16" fill="#602B7A"/>
    <rect x="6" y="30" width="8" height="6" fill="#FFD749"/><rect x="24" y="30" width="8" height="6" fill="#FFD749"/><rect x="42" y="30" width="8" height="6" fill="#FFD749"/>
  </g>
  <text id="student-name" x="620" y="734" class="montserrat purple" font-size="50" font-weight="800">NOMBRE DEL ESTUDIANTE</text>

  <!-- Message box -->
  <rect x="530" y="800" width="497" height="350" rx="25" fill="#602B7A" stroke="#33DFC0" stroke-width="6"/>
  <path d="M1008 1090H1027V1110H1008V1130H989V1150H950V1133H970V1113H989V1090Z" fill="#FFD749"/>
  <path d="M579 846L594 861L579 876" fill="none" stroke="#33DFC0" stroke-width="9" stroke-linecap="square"/>
  <text x="625" y="875" class="montserrat white" font-size="34" font-weight="500">Que este nuevo año</text>
  <text x="625" y="928" class="montserrat white" font-size="34" font-weight="500">venga lleno de <tspan fill="#33DFC0" font-weight="800">ideas,</tspan></text>
  <text x="625" y="981" class="montserrat white" font-size="34" font-weight="500"><tspan fill="#F44C75" font-weight="800">proyectos</tspan> y <tspan fill="#FFD749" font-weight="800">sueños</tspan></text>
  <text x="625" y="1034" class="montserrat white" font-size="34" font-weight="500">que puedas convertir</text>
  <text x="625" y="1087" class="montserrat white" font-size="34" font-weight="500">en realidad.</text>

  <!-- Bottom pixel terrain -->
  <path fill="#602B7A" d="M0 1098H498V1140H535V1180H574V1220H612V1260H660V1300H700V1250H780V1300H820V1260H858V1220H896V1180H934V1140H972V1100H1080V1350H0Z"/>
  <g fill="#7D3A99" opacity="0.55">
    <rect x="0" y="1185" width="40" height="40"/><rect x="40" y="1225" width="40" height="40"/><rect x="80" y="1185" width="40" height="40"/>
    <rect x="120" y="1265" width="40" height="40"/><rect x="160" y="1225" width="40" height="40"/><rect x="200" y="1305" width="40" height="40"/>
    <rect x="930" y="1210" width="40" height="40"/><rect x="970" y="1250" width="40" height="40"/><rect x="1010" y="1210" width="40" height="40"/>
  </g>
  <g>
    <rect x="655" y="1185" width="12" height="12" fill="#602B7A"/><rect x="731" y="1204" width="12" height="12" fill="#602B7A"/><rect x="769" y="1178" width="12" height="12" fill="#602B7A"/>
  </g>

  <!-- Student-photo slot. Replace ONLY href/position fit; preserve geometry. -->
  <g id="photo-slot" clip-path="url(#studentClip)">
    <rect x="0" y="285" width="526" height="1065" fill="#602B7A" opacity="0.12"/>
    <image id="student-photo" href="" x="-18" y="285" width="558" height="1065" preserveAspectRatio="xMidYMax slice"/>
    <g id="photo-placeholder" opacity="0.38">
      <circle cx="260" cy="520" r="112" fill="#FFFFFF"/>
      <path d="M83 1120C102 854 179 689 260 689C345 689 428 850 452 1120Z" fill="#FFFFFF"/>
      <text x="52" y="1260" class="montserrat white" font-size="27" font-weight="800">REEMPLAZAR POR FOTO REAL</text>
    </g>
  </g>

  <!-- Template note (remove in final export) -->
  <g id="template-note">
    <rect x="54" y="1292" width="410" height="35" rx="17" fill="#FFFFFF" opacity="0.92"/>
    <text x="75" y="1316" class="montserrat purple" font-size="15" font-weight="700">PLANTILLA APROBADA · SOLO CAMBIAR FOTO + NOMBRE</text>
  </g>
</svg>
